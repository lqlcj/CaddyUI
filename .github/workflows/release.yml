name: build

# 每次推到 main 就交叉编译一份 Linux 二进制，挂到 latest 这个 Release 上。
# install.sh 直接从 releases/latest/download/ 取，用户就不用在小机器上编译了。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建 React 前端
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go 测试
        run: go test ./...

      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: 浏览器回归测试
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm test

      - name: 交叉编译
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/caddyui-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/caddyui-linux-arm64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o dist/caddyui-linux-armv7 .
          ls -lh dist

      - name: 发布到 latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/* \
            --title "latest" \
            --notes "由 ${GITHUB_SHA:0:7} 自动构建。安装：curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | sudo bash" \
            --latest
